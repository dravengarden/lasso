# Lasso module catalog — installable capability packs for agent monorepo workspaces.

[[module]]
id = "docs-index"
version = "0.1.0"
kind = "capability"
description = "Documentation INDEX.md contract and checker scripts"
path = "modules/docs-index"
default = true

[[module]]
id = "lang-go"
version = "0.1.0"
kind = "convention"
description = "Go coding conventions for Lasso workspaces"
path = "modules/lang-go"
skills = []

[[module]]
id = "lang-rust"
version = "0.1.0"
kind = "convention"
description = "Rust coding conventions for Lasso workspaces"
path = "modules/lang-rust"

[[module]]
id = "lang-nix"
version = "0.1.0"
kind = "convention"
description = "Nix coding conventions for Lasso workspaces"
path = "modules/lang-nix"

[[module]]
id = "security"
version = "0.2.0"
kind = "plugin"
description = "Deterministic dependency and supply-chain scanning"
path = "modules/security"
skills = ["security-scan"]

[[module]]
id = "hooks"
version = "0.1.0"
kind = "plugin"
description = "Stateless Git/worktree safety hooks for agent sessions"
path = "modules/hooks"

[[module]]
id = "memory"
version = "0.2.0"
kind = "plugin"
description = "Cross-runtime durable memory sync and tidy"
path = "modules/memory"
skills = ["memory-sync", "memory-tidy"]

[[module]]
id = "npm-release"
version = "0.1.1"
kind = "plugin"
description = "Native npm release, Trusted Publisher, acceptance, and package-page workflows"
path = "modules/npm-release"
skills = ["release-npm-package", "maintain-npm-package-page"]

[[module]]
id = "pypi-release"
version = "0.1.1"
kind = "plugin"
description = "Native PyPI release, Trusted Publisher, acceptance, and project-page workflows"
path = "modules/pypi-release"
skills = ["release-pypi-package", "maintain-pypi-package-page"]

[[module]]
id = "cargo-release"
version = "0.1.1"
kind = "plugin"
description = "Native Cargo release, crates.io Trusted Publisher, acceptance, and crate-page workflows"
path = "modules/cargo-release"
skills = ["release-cargo-package", "maintain-crates-io-package-page"]
