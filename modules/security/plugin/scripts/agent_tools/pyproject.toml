[project]
name = "agent-tools"
version = "0.0.0"
description = "Security scan and report helpers bundled by the Lasso Security Codex plugin"
#
# Pinned to >=3.14 to match the dev-shell's free-threading CPython: with no
# managed 3.14t available, uv resolves to the nix python on PATH (same as the
# former root harness). A looser bound makes uv download a standard managed
# CPython that then can't introspect the free-threading venv.
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.12.0",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
security-scan = "agent_tools.security_scan.scan:app"
security-report = "agent_tools.security_scan.report:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tools"]
exclude = ["**/*_test.py", "**/conftest.py"]

# Go-style co-located tests use a foo_test.py suffix. Importlib mode lets
# same-named test modules coexist across subpackages.
[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

# =============================================================================
# ruff — mirrors the (former) root harness config
# =============================================================================
[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "COM812",  # trailing-comma (formatter owns this)
    "ISC001",  # single-line-implicit-concat (formatter owns this)
    "CPY001",  # copyright-notice (repo has no copyright-header convention)
    "PLR0917", # too-many-positional-arguments (typer commands legitimately exceed 5)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["agent_tools"]

[tool.ruff.lint.flake8-type-checking]
# pydantic models + typer commands evaluate annotations at runtime, so
# type-only imports (Path, etc.) must stay at module scope — do NOT move
# them into a TYPE_CHECKING block (see columbus memory: ruff-tc-pydantic-typer).
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.per-file-ignores]
"**/*_test.py" = ["S101", "D", "ANN", "PLR2004", "T201"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# =============================================================================
# ty — type checking
# =============================================================================
[tool.ty.environment]
python-version = "3.14"
